name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: SHOWROOM error recovery regression
        run: pnpm test:sr-error
        env:
          RUNNER_TEST_ARTIFACTS: test-results/sr-error

      - name: Upload error recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sr-error-recovery
          path: test-results/sr-error
          if-no-files-found: ignore

      - name: Build
        run: pnpm build
